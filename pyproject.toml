[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-triage"
version = "0.1.0"
description = "Triage-and-governance layer for MCP fleets: LLM-assisted false-positive reduction + least-privilege/egress policy mapped to the OWASP MCP Top 10."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raj Penchala" }]
keywords = ["mcp", "security", "owasp", "triage", "governance", "llm"]
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7"]

[project.scripts]
mcp-triage = "mcp_triage.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_triage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
